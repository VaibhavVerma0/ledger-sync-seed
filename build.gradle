plugins {
    id 'java'
    id 'application'
}

group = 'in.simplifymoney'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    // The main source set compiles against the JDK alone. The H2 driver is
    // loaded reflectively by java.sql.DriverManager at run time, so it is a
    // runtime dependency only. Add whatever you need for your document store.
    runtimeOnly 'com.h2database:h2:2.2.224'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'in.simplifymoney.ledgersync.App'
}

test { useJUnitPlatform() }

// Dependency-free smoke run. Works with no network and no database.
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    mainClass = 'in.simplifymoney.ledgersync.SelfCheck'
    classpath = sourceSets.main.runtimeClasspath
}
// The main source set stays JDK-only so verify.sh, which compiles it with plain
// javac and no classpath, keeps working. The Mongo driver lives here instead.
sourceSets {
    docstore {
        java.srcDir 'src/docstore/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    docstoreImplementation 'org.mongodb:mongodb-driver-sync:5.1.4'
    docstoreRuntimeOnly 'com.h2database:h2:2.2.224'
}

// Entry point for everything that touches the document store:
//   ./gradlew docstore --args="backfill"
//   ./gradlew docstore --args="check"
//   ./gradlew docstore --args="bench 100000"
tasks.register('docstore', JavaExec) {
    group = 'application'
    mainClass = 'in.simplifymoney.ledgersync.docstore.DocStoreApp'
    classpath = sourceSets.docstore.runtimeClasspath
}